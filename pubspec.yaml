name: easyhealthy
description: "An academic wellness app for meal tracking, recipe recommendations, habits, and workout planning."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  firebase_ui_auth: ^3.0.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.0.3
  google_fonts: ^6.3.2
  percent_indicator: ^4.2.5
  fl_chart: ^1.1.1
  intl: ^0.20.2
  http: ^1.5.0
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  dropdown_search: ^5.0.6
  google_generative_ai: ^0.4.0
  multi_select_flutter: ^4.1.3
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^5.0.1
  timezone: ^0.9.4
  flutter_launcher_icons: ^0.14.4
  pdf: ^3.10.8
  printing: ^5.12.0
  shimmer: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/EasyHealthyLogo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/seeds/
    - assets/recipes.json
